#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # локальный интерфейс
        iif "lo" accept

        # уже установленные соединения (ответы на исходящие)
        ct state established,related accept

        # ICMP/ICMPv6 (важно для диагностики и для нормальной работы IPv6: ND/RA)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # открыть нужные порты (обычно это TCP)
        tcp dport { 80, 443, 22, {PORT} } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}